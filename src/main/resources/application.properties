spring.application.name=employee-management-system
server.port=8080

# Override with environment variables if needed (DB_HOST, DB_NAME, DB_USER, DB_PASSWORD)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:employee_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
